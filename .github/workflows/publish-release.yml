name: Publish existing APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-black-launcher-5
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify successful source build
        run: |
          set -euo pipefail
          conclusion=$(gh api repos/$GH_REPO/actions/runs/39249358203 --jq .conclusion)
          sha=$(gh api repos/$GH_REPO/actions/runs/39249358203 --jq .head_sha)
          test "$conclusion" = success
          test "$sha" = 04fc152d1b63d424bb8fa89951fc5b8c11a834f9
      - name: Download compiled APK
        run: |
          set -euo pipefail
          gh run download 39249358203 --name Black-1.3.2-launcher-teste.5 --dir apk
          test -s apk/Black-1.3.2-launcher-teste.5.apk
      - name: Publish release
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Black Android ARM64 com launcher, editor de controles e seletores renovados.

          - Launcher com cartões escuros, cantos arredondados e seletores de arquivos e presets.
          - Sensibilidade separada para mouse e tela de toque.
          - Editor de posição, tamanho e visibilidade dos controles no launcher.
          - Chave ao lado da pausa para abrir o editor dentro do jogo: arraste e toque em SALVAR.
          - Layout e sensibilidade são recarregados ao retornar para uma sessão aberta.
          - Analógico disponível nos menus e botão ENTER para confirmar.

          ## Instalação
          Este APK mantém o nome Black Preview e o pacote com.racas.black.preview. Atualiza as prévias anteriores e instala ao lado do Black Android original. A assinatura foi conferida com a prévia 4.

          Autorize o acesso à pasta /storage/emulated/0/Black ou importe sua ISO pelo launcher. Os arquivos do jogo não estão incluídos.

          ## Validação
          Build concluído com sucesso, 77 verificações dos controles e testes de leitura/gravação do layout entre o editor Java e o jogo nativo. Gameplay e aparência final ainda precisam ser conferidos no aparelho.
          NOTES
          printf '\nSHA-256 do APK: ' >> notes.md
          sha256sum apk/Black-1.3.2-launcher-teste.5.apk | cut -d' ' -f1 >> notes.md
          gh release create v1.3.2-launcher-teste.5 apk/Black-1.3.2-launcher-teste.5.apk --target 04fc152d1b63d424bb8fa89951fc5b8c11a834f9 --title "Black Android 1.3.2 — Launcher e controles" --notes-file notes.md --latest
